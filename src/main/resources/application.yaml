spring:
  application:
    name: shop

  datasource:
    url: jdbc:postgresql://localhost:5432/shopdb
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10

  jpa:
    hibernate:
      ddl-auto: update # update pour dev, validate ou none pour prod
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: "LONG_RANDOM_SECRET_32+_CHARS"
  duration: 3600000  # 1h en ms